<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case — Ekaterina Khromova</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=en-3" />
    <link rel="stylesheet" href="./cases.css?v=en-3" />
  </head>
  <body class="case-body">
    <header class="case-nav">
      <a class="case-nav__link" href="./index.html">ekaterina khromova</a>
      <a class="case-nav__link" href="./projects.html" id="case-back">← all projects</a>
    </header>

    <main class="case" id="case">
      <p class="case__empty">Case not found. <a href="./projects.html">All projects →</a></p>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox__close" type="button" aria-label="Close">close</button>
      <button class="lightbox__arrow lightbox__arrow--prev" type="button" aria-label="Previous image">←</button>
      <figure class="lightbox__figure">
        <img class="lightbox__img" alt="" />
        <figcaption class="lightbox__caption"></figcaption>
      </figure>
      <button class="lightbox__arrow lightbox__arrow--next" type="button" aria-label="Next image">→</button>
    </div>

    <div class="board" id="board" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Project board">
      <div class="board__canvas" id="board-canvas"></div>
      <p class="board__hint">drag to move · scroll or pinch to zoom</p>
      <div class="board__controls">
        <button class="board__button" type="button" data-board="in" aria-label="Zoom in">+</button>
        <button class="board__button" type="button" data-board="out" aria-label="Zoom out">−</button>
        <button class="board__button board__button--wide" type="button" data-board="home">whole board</button>
      </div>
      <button class="showcase__close board__close" type="button" aria-label="Close board"><span aria-hidden="true">x</span></button>
    </div>

    <script src="./cases.js?v=en-3"></script>
    <script src="./canvas-board.js?v=en-3"></script>
    <script src="./case-page.js?v=en-3"></script>
  </body>
</html>
