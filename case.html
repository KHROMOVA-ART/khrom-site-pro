<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кейс — Екатерина Хромова</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=fig-107" />
    <link rel="stylesheet" href="./cases.css?v=fig-107" />
  </head>
  <body class="case-body">
    <header class="case-nav">
      <a class="case-nav__link" href="./index.html">екатерина хромова</a>
      <a class="case-nav__link" href="./projects.html" id="case-back">← все проекты</a>
    </header>

    <main class="case" id="case">
      <p class="case__empty">Кейс не найден. <a href="./projects.html">Все проекты →</a></p>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox__close" type="button" aria-label="Закрыть">закрыть</button>
      <button class="lightbox__arrow lightbox__arrow--prev" type="button" aria-label="Предыдущее изображение">←</button>
      <figure class="lightbox__figure">
        <img class="lightbox__img" alt="" />
        <figcaption class="lightbox__caption"></figcaption>
      </figure>
      <button class="lightbox__arrow lightbox__arrow--next" type="button" aria-label="Следующее изображение">→</button>
    </div>

    <div class="board" id="board" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Доска проекта">
      <div class="board__canvas" id="board-canvas"></div>
      <p class="board__hint">тяните, чтобы двигаться · колесо или щипок — масштаб</p>
      <div class="board__controls">
        <button class="board__button" type="button" data-board="in" aria-label="Приблизить">+</button>
        <button class="board__button" type="button" data-board="out" aria-label="Отдалить">−</button>
        <button class="board__button board__button--wide" type="button" data-board="home">вся доска</button>
      </div>
      <button class="showcase__close board__close" type="button" aria-label="Закрыть доску"><span aria-hidden="true">x</span></button>
    </div>

    <script src="./cases.js?v=fig-107"></script>
    <script src="./canvas-board.js?v=fig-107"></script>
    <script src="./case-page.js?v=fig-107"></script>
  </body>
</html>
